owner: dmpumwire
repo: upptime

sites:
  - name: FMS Production
    url: https://fms.requitytrack.com
    maxResponseTime: 3000
    # icon: https://status.requitynetworks.com/icons/fms.png
    __dangerous__body_down_if_text_missing: "<title>Requity Track</title>"
    __dangerous__body_down_if_regex_missing: '^(?![\s\S]*(?:[Hh]acked [Bb]y|HACKED BY|[Dd]efaced|DEFACED|[Oo]wned [Bb]y|[Pp]wned|PWNED))'
  - name: Signal SMS Prod
    url: https://portal.signalsms.net
    maxResponseTime: 3000
    # icon: https://status.requitynetworks.com/icons/signalsms.png
    __dangerous__body_down_if_text_missing: "<title>Portal</title>"
    __dangerous__body_down_if_regex_missing: '^(?![\s\S]*(?:[Hh]acked [Bb]y|HACKED BY|[Dd]efaced|DEFACED|[Oo]wned [Bb]y|[Pp]wned|PWNED))'
  - name: OMS Production
    url: https://app.qfu.co.ug/
    maxResponseTime: 3000
    # icon: https://status.requitynetworks.com/icons/oms.png
    __dangerous__body_down_if_text_missing: "<title>Quantum Foods Uganda | Shop Poultry Products</title>"
    __dangerous__body_down_if_regex_missing: '^(?![\s\S]*(?:[Hh]acked [Bb]y|HACKED BY|[Dd]efaced|DEFACED|[Oo]wned [Bb]y|[Pp]wned|PWNED))'
    expectedStatusCodes:
      - 200
      - 301

assignees:
  - dmpumwire

# Keep every incident in the public history, including ones shorter than 15 minutes
skipDeleteIssues: true

status-website:
  cname: status.requitynetworks.com
  logoUrl: https://status.requitynetworks.com/logo.png
  favicon: https://status.requitynetworks.com/favicon.png
  themeUrl: https://status.requitynetworks.com/requity-theme.css
  name: Requity Networks Status
  introTitle: "**Requity Networks** System Status"
  introMessage: "Live availability and response times for our services, checked every 5 minutes. Experiencing an issue not shown here? Contact [support@requitynetworks.com](mailto:support@requitynetworks.com)."
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap
  metaTags:
    - name: theme-color
      content: "#132a4c"
    - name: description
      content: "Live status and uptime for Requity Networks services."
  navbar:
    - title: Status
      href: /
    - title: Support
      href: mailto:support@requitynetworks.com
    - title: Website
      href: https://requitynetworks.com
    # Uncomment once the public Telegram channel exists (replace requitystatus with its real username)
    # - title: Get Alerts
    #   href: https://t.me/requitystatus

i18n:
  footer: "© 2026 [Requity Networks](https://requitynetworks.com) · [support@requitynetworks.com](mailto:support@requitynetworks.com)"
  allSystemsOperational: "All Requity services are running normally"
  activeIncidents: "Current incidents"
