# Change these first
owner: dmpumwire # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: FMS Production
    url: https://fms.requitytrack.com
  - name: Signal SMS Prod
    url: https://portal.signalsms.net
  - name: OMS Production
    url: https://app.qfu.co.ug/
    expectedStatusCodes:
      - 200
      - 301

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.requitynetworks.com
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Requity Networks Status
  introTitle: "**Requity Networks** System Status."
  introMessage: "Current uptime and performance of our monitored services."
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

